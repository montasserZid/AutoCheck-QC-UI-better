                  - heading "La vérité, pas la quantité" [level=2] [ref=f360e308]
                  - paragraph [ref=f360e309]: Pour Aimoove, un rapport de fiabilité ne se mesure pas au nombre de sources, mais à leur intégrité.
                - paragraph [ref=f360e311]: Contrairement aux promesses de "milliers de bases de données internationales" aux mises à jour incertaines, nous avons fait le choix de l'exigence. Nos rapports s'appuient exclusivement sur un réseau d'institutions nationales officielles, de registres constructeurs certifiés et de partenaires techniques agréés.
