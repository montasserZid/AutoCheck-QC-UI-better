                - generic [ref=f360e328]:
                  - generic [ref=f360e329]:
                    - button "Pourquoi utiliser Aimoove avant d’acheter une voiture ?" [ref=f360e330] [cursor=pointer]
                    - generic [ref=f360e335]: L'achat d'un véhicule d'occasion est souvent stressant. Aimoove retire l'incertitude en vous fournissant un "check-up" digital complet. Là où un vendeur peut omettre un détail, nos données révèlent la réalité historique et technique du véhicule.
                  - generic [ref=f360e336]:
                    - button "Aimoove est-il un site de petites annonces ?" [ref=f360e337] [cursor=pointer]
                    - generic [ref=f360e342]: Non. Aimoove est un tiers de confiance. Nous ne vendons pas de voitures, nous vendons de la transparence. Vous trouvez votre voiture sur n'importe quelle plateforme (Leboncoin, La Centrale, etc.), et vous utilisez Aimoove pour vérifier si c'est une bonne affaire.
                  - generic [ref=f360e343]:
                    - button "Quelles informations vais-je recevoir exactement ?" [ref=f360e344] [cursor=pointer]
                    - generic [ref=f360e349]: "Le rapport se divise en 5 piliers essentiels : • Le Juste Prix : Une analyse comparative pour savoir si le vendeur est trop gourmand ou si le prix est suspectement bas. • L'Historique : Le nombre de mains, l'usage précédent (ex: ancienne voiture de location) et la cohérence du kilométrage, contrôles techniques… • Santé Technique : Les points de vigilance spécifiques à ce modèle (faiblesses moteur connues, rappels constructeurs), consommation, concurrents. • Le Score Aimoove : Une note globale sur 100 pour décider en un coup d'œil. • L'Analyse d’annonce : Vous hésitez entre plusieurs modèles ? Aimoove vous aide à choisir la meilleure annonce."
                  - generic [ref=f360e350]:
                    - button "Combien de temps faut-il pour générer un rapport ?" [ref=f360e351] [cursor=pointer]
                    - generic [ref=f360e356]: C'est quasi instantané. Une fois l'immatriculation saisie ou le modèle rentré, notre algorithme traite les données en moins de 3 minutes pour générer votre rapport interactif.
                  - generic [ref=f360e357]:
                    - button "Le rapport est-il payant ?" [ref=f360e358] [cursor=pointer]
                    - generic [ref=f360e363]: "Oui, nous proposons 3 formules: • Le rapport EXPERT ONE vous permet de vérifier un véhicule avant d’acheter. • La formule EXPERT PACK est un pack de 3 rapports si vous hésitez entre plusieurs modèles. • La formule EXPERT MAX est un pack de 10 rapports pour les passionnés qui veulent vérifier autant de véhicules qu’ils le souhaitent."
                  - generic [ref=f360e364]:
                    - button "Comment pouvez-vous connaître l'état d'une voiture sans la voir ?" [ref=f360e365] [cursor=pointer]
                    - generic [ref=f360e370]: Nous utilisons la puissance de la donnée ("Big Data"). En croisant les registres d'immatriculation, les historiques de maintenance, les bases de données de pannes européennes et les cotes du marché en temps réel, nous obtenons une image fidèle du véhicule sans déplacement physique.
                  - generic [ref=f360e371]:
                    - button "Que se passe-t-il si l'immatriculation n'est pas reconnue ?" [ref=f360e372] [cursor=pointer]
                    - generic [ref=f360e377]: Cela arrive parfois pour des véhicules très récents. Dans ce cas, notre support technique vous rembourse sous 24h sans discussion.
                  - generic [ref=f360e378]:
                    - button "Est-ce que Aimoove me garantit que la voiture ne tombera jamais en panne ?" [ref=f360e379] [cursor=pointer]
                    - generic [ref=f360e384]: Aucun outil ne peut prédire l'avenir à 100%, mais Aimoove réduit drastiquement le risque. Nous vous signalons les "loups" potentiels et les pannes statistiques qui touchent précisément le modèle que vous convoitez.
                  - generic [ref=f360e385]:
                    - button "Puis-je partager le rapport avec le vendeur pour négocier ?" [ref=f360e386] [cursor=pointer]
                    - generic [ref=f360e391]: Absolument ! C'est d'ailleurs l'une des utilisations préférées de nos utilisateurs. Si le rapport Aimoove indique des frais à prévoir ou un prix au-dessus du marché, vous disposez d'un argument factuel et solide pour faire baisser le prix de vente.
                  - generic [ref=f360e392]:
                    - button "Pourquoi choisir Aimoove plutôt qu'un autre service de rapport d'historique (Histovec, CarVertical, etc.) ?" [ref=f360e393] [cursor=pointer]
                    - generic [ref=f360e398]: "La plupart de nos concurrents se contentent de compiler des données passées avec des sources parfois non vérifiées (accidents enregistrés, kilométrage). Aimoove va beaucoup plus loin grâce à l'Intelligence Artificielle : • L'analyse prédictive : Là où les autres vous disent ce qui est arrivé à la voiture, Aimoove vous dit ce qui risque de lui arriver. Notre algorithme analyse les faiblesses structurelles de chaque modèle (ex: courroie de distribution fragile sur tel moteur à 80 000 km) pour vous alerter avant la panne. • Un Score de Fiabilité unique : Nous ne vous livrons pas seulement une liste brute de données. Nous traduisons ces informations complexes en un Score de Fiabilité clair, vous permettant de comparer deux véhicules instantanément. • Analyse du Marché en Temps Réel : Contrairement aux rapports statiques, nous intégrons une analyse de prix dynamique. Nous vous disons si le véhicule est une opportunité financière ou une mauvaise affaire selon l'état actuel du marché. • Accompagnement Personnalisé : Aimoove ne se contente pas de vous donner un PDF. Notre interface est conçue pour être votre \"assistant d'achat\" personnel, vous guidant sur les points spécifiques à vérifier lors de votre visite physique. En résumé : Les autres regardent dans le rétroviseur, Aimoove regarde la route devant vous pour sécuriser votre investissement à long terme."
                  - generic [ref=f360e399]:
                    - button "Puis-je avoir toute confiance en la fiabilité d'Aimoove ?" [ref=f360e400] [cursor=pointer]
                    - generic [ref=f360e405]: "Absolument. Contrairement à de nombreux services en ligne anonymes, Aimoove est une entreprise française solidement ancrée dans l'écosystème de l'innovation. Notre sérieux et la pertinence de notre technologie sont validés par les institutions les plus prestigieuses : • Lauréat Novacité (CCI) : Un label d'excellence récompensant les entreprises à fort potentiel et à la fiabilité éprouvée. • Soutien de la Région Auvergne-Rhône-Alpes : Nous sommes accompagnés par la région dans notre développement technologique. • Membre de la French Tech (Lyon & Grand Paris) : Cette appartenance garantit que nous respectons les standards les plus élevés en matière d'innovation et de protection des données. Ces partenaires ne nous apportent pas seulement leur logo ; ils ont audité notre modèle économique et la valeur de nos algorithmes. Choisir Aimoove, c'est choisir une solution reconnue, certifiée et soutenue par les acteurs majeurs de l'économie française."
                  - generic [ref=f360e406]:
                    - button "Une question spécifique ?" [ref=f360e407] [cursor=pointer]
                    - generic [ref=f360e412]: Notre équipe est à votre écoute pour vous accompagner dans votre projet d'achat. Contactez-nous !
